name: Build Live TV APKs

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/live-tv/**'
      - 'build_live_tv.sh'
      - '.github/workflows/build-live-tv.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android-arm
            artifact: live-tv-android-arm
          - target: android-arm64
            artifact: live-tv-android-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-dependency-path: apps/live-tv/pubspec.lock

      - name: Install Flutter dependencies
        working-directory: apps/live-tv
        run: flutter pub get

      - name: Build release APK
        working-directory: apps/live-tv
        run: >-
          flutter build apk --release
          --target-platform ${{ matrix.target }}
          --android-skip-build-dependency-validation

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: apps/live-tv/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
